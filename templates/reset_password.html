{% extends "base.html" %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <div class="auth-icon">
            🔑
        </div>

        <h1>Reset Password</h1>

        <p class="auth-subtitle">
            Enter your new password below.
        </p>

        <form method="POST">

            <div class="form-group">

                <label for="password">
                    🔒 New Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter new password"
                    minlength="6"
                    required
                >

            </div>

            <div class="form-group">

                <label for="confirm_password">
                    🔒 Confirm Password
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Confirm new password"
                    minlength="6"
                    required
                >

            </div>

            <button
                type="submit"
                class="auth-button"
            >
                Reset Password
            </button>

        </form>

        <div class="auth-footer">

            <a href="{{ url_for('login') }}">
                ← Back to Login
            </a>

        </div>

    </div>

</div>

{% endblock %}
