{% extends "base.html" %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <div class="auth-icon">
            🔐
        </div>

        <h1>Forgot Password?</h1>

        <p class="auth-subtitle">
            Enter your registered email address to reset your password.
        </p>

        <form method="POST">

            <div class="form-group">

                <label for="email">
                    📧 Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your registered email"
                    required
                >

            </div>

            <button
                type="submit"
                class="auth-button"
            >
                Send Reset Link
            </button>

        </form>

        <div class="auth-footer">

            <a href="{{ url_for('login') }}">
                ← Back to Login
            </a>

        </div>

    </div>

</div>

{% endblock %}
