{% extends "base.html" %}
{% block content %}

<div class="auth-container">

    <div class="auth-box">

        <div class="auth-icon">
            👤
        </div>

        <h1>Create Account</h1>

        <p>Join our smart waste management system</p>

        <form method="POST">

            <label>
                👤 Full Name
            </label>

            <input
                type="text"
                name="name"
                placeholder="Enter your full name"
                required
            >

            <label>
                📧 Email Address
            </label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label>
                🔑 Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Create a password"
                required
            >

            <button type="submit">
                🚀 Create Account
            </button>

        </form>

        <p class="auth-link">
            Already have an account?
            <a href="{{ url_for('login') }}">
                Login
            </a>
        </p>

    </div>

</div>

{% endblock %}
